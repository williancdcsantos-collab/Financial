<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Finanças</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f4fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<style>
:root{--bg:#f4f5f8;--surface:#fff;--ink:#1a2233;--muted:#667085;--line:#dde1ea;--rec:#1f9d6b;--des:#d2563f;--accent:#2f4fd1;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f131c;--surface:#181e2b;--ink:#e9edf6;--muted:#97a1b5;--line:#2a3347;--rec:#3fcf97;--des:#ff8266;--accent:#7f98ff;--accent-ink:#0c1230;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;min-height:100vh;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(100px + env(safe-area-inset-bottom,0px))}
h1{font-size:1.6rem;margin:0;font-weight:800;letter-spacing:-.02em}
h3{margin:0 0 12px;font-size:1rem;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between}
button{font:inherit;font-weight:600;font-size:.95rem;border-radius:12px;padding:10px 14px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;gap:6px;margin:14px 0 10px}.seg button{flex:1;padding:8px 4px}
.nav{justify-content:space-between;margin-bottom:14px}
.nav b{text-transform:capitalize;text-align:center;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.verd{font-size:1.45rem;font-weight:800;line-height:1.2;margin-bottom:14px}
.bar{height:16px;border-radius:8px;background:var(--line);overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;border-radius:8px}
.lbl{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.chart{display:flex;gap:3px;align-items:flex-end;height:120px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;min-width:0}
.pair{display:flex;gap:1px;align-items:flex-end;height:100px;width:100%;justify-content:center}
.pair i{flex:1;max-width:10px;border-radius:3px 3px 0 0;min-height:1px}
.col span{font-size:.65rem;color:var(--muted);height:14px}
.cat{margin-bottom:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item small{color:var(--muted);display:block}
.x{padding:4px 10px;font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:26px 8px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:15px 26px;font-size:1.05rem;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:5;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 40px;display:flex;justify-content:center}
.sheet>div{width:100%;max-width:480px}
.big{font-size:2.2rem;font-weight:800;border:0;border-bottom:3px solid var(--line);background:transparent;color:var(--ink);width:100%;padding:8px 0;border-radius:0}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password]{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:11px 13px}
label.f{display:block;font-weight:600;margin:16px 0 6px;font-size:.9rem;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{padding:8px 12px}
.err{color:var(--des);min-height:1.2em;margin:8px 0}
.dica{color:var(--muted);margin:8px 0 0;font-size:.9rem}
</style>
</head>
<body>
<main id="app"><p class="empty">Carregando…</p></main>
<script type="module" src="app.js"></script>
</body>
</html>
